name: Dev Branch CI

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
      - main

jobs:
  build:
    runs-on: [self-hosted, linux, arkserver]

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements.txt pytest

      - name: Syntax check
        run: .venv/bin/python -m py_compile server.py

      - name: WhatsApp tool contract and caller identity
        env:
          MCP_SERVERS: comm
        run: .venv/bin/python -m pytest -q tests/test_whatsapp_group_send_tool.py tests/test_targeted_release.py test_agent_name_header_sites.py
